<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotary Club of Makati – Admin Systems</title>
<meta name="theme-color" content="#17458f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RCM Admin">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{--blue:#17458f;--blue-d:#0f2f66;--gold:#f7a81b;--bg:#f4f6fb;--ink:#1c2433;--mut:#6b7488;--line:#e2e6ef;--red:#c0392b;--green:#1e8e5a;--tabh:60px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  button{font:inherit;cursor:pointer}
  .hidden{display:none!important}
  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--blue-d),var(--blue))}
  .card{background:#fff;border-radius:16px;padding:36px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .logo{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--blue-d);display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 14px;border:4px solid var(--blue)}
  .card h1{font-size:20px;margin:0 0 4px;color:var(--blue-d)}
  .card p{color:var(--mut);margin:0 0 22px;font-size:14px}
  #gbtn{display:flex;justify-content:center;min-height:44px}
  .err{color:var(--red);font-size:13px;margin-top:16px;min-height:18px}
  .busy{color:var(--mut);font-size:13px;margin-top:12px}
  .linkbtn{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;margin-top:14px;text-decoration:underline}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh}
  header{background:var(--blue);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top));border-bottom:3px solid var(--gold);flex-shrink:0}
  header .brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
  header .brand .logo{width:34px;height:34px;font-size:12px;margin:0;border-width:2px}
  nav{display:flex;gap:4px;flex:1;overflow-x:auto;height:56px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{background:none;border:0;color:#cfdcf5;padding:0 14px;height:100%;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
  nav button:hover{color:#fff}
  nav button.on{color:#fff;border-bottom-color:var(--gold);font-weight:600}
  nav .ic,nav .short{display:none}
  .me{display:flex;align-items:center;gap:10px;font-size:13px}
  .me img{width:30px;height:30px;border-radius:50%;background:#fff}
  .me .who{line-height:1.15;text-align:right}
  .me .who small{color:#b8c8ea;display:block}
  .out{background:rgba(255,255,255,.12);border:0;color:#fff;padding:7px 12px;border-radius:6px}
  .out:hover{background:rgba(255,255,255,.22)}
  .out.gold{background:var(--gold);color:var(--blue-d);font-weight:700}
  main{flex:1;min-height:0;position:relative}
  .frame{position:absolute;inset:0;display:flex;flex-direction:column}
  .frame .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
  .frame .bar a{color:var(--blue);text-decoration:none;font-weight:600;white-space:nowrap}
  .frame iframe{flex:1;border:0;width:100%;background:#fff}
  .pane{position:absolute;inset:0;overflow:auto;padding:24px;-webkit-overflow-scrolling:touch}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:16px;max-width:1000px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;text-align:left;border-top:4px solid var(--gold)}
  .tile:hover{box-shadow:0 6px 18px rgba(23,69,143,.15)}
  .tile h3{margin:0 0 6px;color:var(--blue-d);font-size:16px}
  .tile p{margin:0;color:var(--mut);font-size:13px}
  h2{margin:0;color:var(--blue-d)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;max-width:1000px;margin-bottom:20px;overflow-x:auto}
  .panel h3{margin:0 0 12px;color:var(--blue-d)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=email]{flex:1;min-width:220px;padding:10px 12px;border:1px solid #cfd5e3;border-radius:8px;font:inherit}
  select{padding:10px;border:1px solid #cfd5e3;border-radius:8px;font:inherit;background:#fff}
  .chk{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:10px}
  .chk label{display:flex;gap:5px;align-items:center}
  .btn{background:var(--blue);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600}
  .btn:hover{background:var(--blue-d)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.ghost{background:#eef1f8;color:var(--blue-d)}
  .btn.danger{background:#fdecea;color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
  .tag.admin{background:#fff3da;color:#9a6200}.tag.member{background:#e6eefc;color:var(--blue)}
  .tag.on{background:#e3f6ec;color:var(--green)}.tag.off{background:#fdecea;color:var(--red)}
  .apps-cell{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
  .apps-cell label{display:flex;gap:3px;align-items:center}
  .note{color:var(--mut);font-size:13px;margin-top:8px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2433;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
  #modal .box{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%}
  #modal h3{margin:0 0 10px;color:var(--blue-d)}
  #modal ol{padding-left:20px;margin:0 0 16px;font-size:14px;line-height:1.6}

  /* ===== MOBILE VIEW ===== */
  @media(max-width:700px){
    .me .who,.brand span,#signout{display:none}
    header{padding:0 12px;gap:10px;justify-content:space-between}
    .me{gap:8px}
    .me img{width:34px;height:34px}
    #meOut{display:inline-block}
    /* bottom tab bar */
    nav{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--blue);border-top:3px solid var(--gold);gap:0;justify-content:flex-start}
    nav button{flex:1 0 20%;min-width:68px;padding:4px 2px;border:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;position:relative}
    nav button.on{background:rgba(255,255,255,.12)}
    nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
    nav .full{display:none}
    nav .ic{display:block;font-size:20px;line-height:1}
    nav .short{display:block}
    main{margin-bottom:calc(var(--tabh) + 3px + env(safe-area-inset-bottom))}
    .pane{padding:16px}
    .grid{grid-template-columns:1fr;gap:12px}
    .tile{padding:16px}
    .frame .bar a{font-size:12px}
    .card{padding:28px 20px}
    .panel{padding:14px}
    input[type=email]{min-width:0;width:100%;font-size:16px}
    select{font-size:16px}
    .row .btn,.row select{flex:1}
    /* user table -> cards */
    table,thead,tbody,tr,td{display:block;width:100%}
    thead{display:none}
    tr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
    td{border:0;padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    td[data-label]::before{content:attr(data-label);font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em}
    td.acts{justify-content:flex-start;flex-wrap:wrap;white-space:normal!important}
    .btn.sm{padding:8px 12px;font-size:13px}
  }
  @media(display-mode:standalone){#installBtn,#installLogin{display:none!important}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">RCM</div>
    <h1>Rotary Club of Makati</h1>
    <p>Admin Systems Portal</p>
    <div id="gbtn"></div>
    <div class="busy hidden" id="busy">Checking access…</div>
    <div class="err" id="loginErr"></div>
    <button class="linkbtn hidden" id="installLogin">⬇ Install this app</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand"><div class="logo">RCM</div><span>Admin Systems</span></div>
    <nav id="nav"></nav>
    <div class="me">
      <button class="out gold hidden" id="installBtn">⬇ Install</button>
      <div class="who"><span id="meName"></span><small id="meRole"></small></div>
      <img id="mePic" alt="">
      <button class="out" id="signout">Sign out</button>
      <button class="out" id="meOut" style="display:none" aria-label="Sign out">⎋</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
/* ============ 1. SETTINGS ============ */
const API_URL   = "https://script.google.com/macros/s/AKfycby5bu-lCbf4qgxyEtTsZc7CDRHWbcax3vtCuZWf_97JJZblYvdPwDbWv-DuQKPOrki6UQ/exec";
const CLIENT_ID = "475258710332-ij24hs1dumfhlc50t5fggkpv6l3c0ec0.apps.googleusercontent.com"; // same one used in Code.gs

/* ============ 2. SYSTEMS INSIDE THE PORTAL – add more here anytime ============ */
const APPS = [
  { id:"social",   icon:"📣", short:"Social",  name:"RCM Social Media Tracker", desc:"Track the club's social media posts and activity.", url:"https://rotaryclubofmakati.github.io/SocialMedia/" },
  { id:"nametag",  icon:"🏷️", short:"Tags",    name:"RCM Name Tag Maker",       desc:"Create and print member and guest name tags.",       url:"https://rotaryclubofmakati.github.io/Name-Tag-Maker/" },
  { id:"travel",   icon:"🚗", short:"Travel",  name:"RCM and MRCFI Travel Logs",desc:"Travel logs for RCM and MRCFI.",                     url:"https://rotaryclubofmakati.github.io/TravelLog/" },
  { id:"errands",  icon:"📝", short:"Errands", name:"RCM Errands Travel Log",   desc:"Travel log for club errands.",                       url:"https://rotaryclubofmakati.github.io/ErrandsTravelLog/" },
  { id:"rotmaksec",icon:"✅", short:"RotMak",  name:"RotMakSec Portal",         desc:"RotMakSec task manager and dashboard.",              url:"https://rotmaksec-task-manager.web.app/dashboard" }
];
/* ================================================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); };
const ERR = {not_authorized:"This Google account is not authorized. Please ask a portal admin to add it.",
  auth:"Your sign-in expired. Please sign in again.", forbidden:"Admins only.", exists:"That account is already on the list.",
  bad_email:"Enter a valid email.", cannot_modify_self:"You can't change your own account.", not_found:"User not found."};

let token = sessionStorage.getItem("rcm_token") || "";
let me = null;

async function api(action, data = {}) {
  const r = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ token, action, ...data }) });
  const j = await r.json();
  if (!j.ok) { const e = new Error(ERR[j.error] || j.message || j.error); e.code = j.error; throw e; }
  return j;
}

function showLogin(msg){
  me = null; token = ""; sessionStorage.removeItem("rcm_token");
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
  $("#busy").classList.add("hidden"); $("#gbtn").classList.remove("hidden");
  $("#loginErr").textContent = msg || "";
}

async function enter(){
  $("#busy").classList.remove("hidden"); $("#gbtn").classList.add("hidden"); $("#loginErr").textContent = "";
  try {
    const j = await api("me");
    me = j.user;
    $("#meName").textContent = me.name || me.email;
    $("#meRole").textContent = me.role === "admin" ? "Administrator" : "Member";
    $("#mePic").src = me.picture || "";
    buildNav(); go("home");
    $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  } catch(e) { showLogin(e.message.includes("fetch") ? "Cannot reach the server. Check the API_URL and deployment." : e.message); }
}

window.addEventListener("load", () => {
  const wait = setInterval(() => {
    if (!window.google || !google.accounts) return;
    clearInterval(wait);
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => { token = r.credential; sessionStorage.setItem("rcm_token", token); enter(); } });
    google.accounts.id.renderButton($("#gbtn"), { theme:"outline", size:"large", text:"signin_with", shape:"rectangular" });
    if (token) enter();
  }, 100);
});
const signOut = () => { try{ google.accounts.id.disableAutoSelect(); }catch(_){} showLogin(); };
$("#signout").onclick = signOut;
$("#meOut").onclick = signOut;

const myApps = () => me.role === "admin" ? APPS : APPS.filter(a => me.apps.includes(a.id));

function buildNav(){
  const items = [{id:"home",name:"Home",short:"Home",icon:"🏠"}, ...myApps()];
  if (me.role === "admin") items.push({id:"admin",name:"⚙ Manage Users",short:"Users",icon:"👥"});
  $("#nav").innerHTML = items.map(i=>`<button data-t="${i.id}"><span class="ic">${i.icon}</span><span class="full">${esc(i.name)}</span><span class="short">${esc(i.short)}</span></button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.t));
}

function go(t){
  $("#nav").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  const main = $("#main");
  if (t === "home") return renderHome(main);
  if (t === "admin" && me.role === "admin") return renderAdmin(main);
  const a = APPS.find(x => x.id === t);
  if (!a || !myApps().includes(a)) return renderHome(main);
  main.innerHTML = `<div class="frame"><div class="bar"><span>${esc(a.name)}</span><a href="${a.url}" target="_blank" rel="noopener">Open in new tab ↗</a></div><iframe src="${a.url}" title="${esc(a.name)}" allow="clipboard-write; fullscreen"></iframe></div>`;
}

function renderHome(main){
  const apps = myApps();
  main.innerHTML = `<div class="pane"><h2>Welcome, ${esc((me.name||me.email).split(" ")[0])} 👋</h2>
    <p class="note">Select a system to open it inside the portal.</p>
    <div class="grid">${apps.map(a=>`<button class="tile" data-t="${a.id}"><h3>${a.icon} ${esc(a.name)}</h3><p>${esc(a.desc)}</p></button>`).join("") || '<p class="note">No systems have been assigned to you yet. Please contact an admin.</p>'}</div></div>`;
  main.querySelectorAll(".tile").forEach(t => t.onclick = () => go(t.dataset.t));
}

async function adminCall(action, data, okMsg){
  try { await api(action, data); if (okMsg) toast(okMsg); return true; }
  catch(e){ if (e.code === "auth") return showLogin(e.message); toast(e.message); return false; }
}

function renderAdmin(main){
  main.innerHTML = `<div class="pane">
    <div class="panel"><h3>Add a Google account</h3>
      <div class="row">
        <input type="email" id="newEmail" placeholder="name@gmail.com">
        <select id="newRole"><option value="member">Member</option><option value="admin">Admin</option></select>
        <button class="btn" id="addBtn">Add user</button>
      </div>
      <div class="chk" id="newApps">${APPS.map(a=>`<label><input type="checkbox" value="${a.id}" checked> ${esc(a.name)}</label>`).join("")}</div>
      <p class="note">Only Google accounts on this list can sign in. Admins can open every system and manage this list.</p>
    </div>
    <div class="panel"><h3>Authorized users</h3><div id="userTable">Loading…</div></div></div>`;
  $("#addBtn").onclick = async () => {
    const email = $("#newEmail").value.trim().toLowerCase();
    const apps = [...$("#newApps").querySelectorAll("input:checked")].map(i=>i.value);
    $("#addBtn").disabled = true;
    if (await adminCall("add", {email, role:$("#newRole").value, apps}, "User added")) { $("#newEmail").value=""; loadUsers(); }
    $("#addBtn").disabled = false;
  };
  loadUsers();
}

async function loadUsers(){
  let rows;
  try { rows = (await api("list")).users; }
  catch(e){ if (e.code === "auth") return showLogin(e.message); $("#userTable").textContent = e.message; return; }
  rows.sort((a,b)=>a.email.localeCompare(b.email));
  $("#userTable").innerHTML = `<table><thead><tr><th>Account</th><th>Role</th><th>Status</th><th>Systems</th><th></th></tr></thead><tbody>${
    rows.map(u=>{
      const self = u.email === me.email;
      return `<tr data-id="${esc(u.email)}">
        <td data-label="Account">${esc(u.email)}${self?' <small>(you)</small>':''}</td>
        <td data-label="Role"><span class="tag ${u.role}">${u.role}</span></td>
        <td data-label="Status"><span class="tag ${u.active?'on':'off'}">${u.active?'active':'disabled'}</span></td>
        <td data-label="Systems">${u.role==='admin'?'<small>All</small>':`<div class="apps-cell">${APPS.map(a=>`<label><input type="checkbox" data-app="${a.id}" ${u.apps.includes(a.id)?'checked':''}> ${esc(a.name.replace('RCM and ','').replace('RCM ',''))}</label>`).join("")}</div>`}</td>
        <td class="acts" style="white-space:nowrap">
          <button class="btn sm ghost" data-act="role" ${self?'disabled':''}>${u.role==='admin'?'Make member':'Make admin'}</button>
          <button class="btn sm ghost" data-act="active" ${self?'disabled':''}>${u.active?'Disable':'Enable'}</button>
          <button class="btn sm danger" data-act="del" ${self?'disabled':''}>Remove</button>
        </td></tr>`;}).join("")
  }</tbody></table>`;
  $("#userTable").querySelectorAll("tr[data-id]").forEach(tr=>{
    const email = tr.dataset.id, u = rows.find(r=>r.email===email);
    tr.querySelectorAll("[data-act]").forEach(b=>b.onclick = async ()=>{
      let ok = false;
      if (b.dataset.act==="role") ok = await adminCall("update",{email,role:u.role==='admin'?'member':'admin'},"Updated");
      if (b.dataset.act==="active") ok = await adminCall("update",{email,active:!u.active},"Updated");
      if (b.dataset.act==="del"){ if(!confirm("Remove "+email+"?")) return; ok = await adminCall("remove",{email},"Removed"); }
      if (ok) loadUsers();
    });
    tr.querySelectorAll("[data-app]").forEach(c=>c.onchange = () => {
      const apps = [...tr.querySelectorAll("[data-app]:checked")].map(i=>i.dataset.app);
      adminCall("update",{email,apps},"Access updated");
    });
  });
}

/* ============ 3. INSTALLABLE APP (PWA) ============ */
let deferredPrompt = null;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function showInstallButtons(){
  if (isStandalone()) return;
  $("#installBtn").classList.remove("hidden");
  $("#installLogin").classList.remove("hidden");
}
function iosHelp(){
  const m = document.createElement("div"); m.id = "modal";
  m.innerHTML = `<div class="box"><h3>Install on iPhone / iPad</h3><ol>
    <li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button.</li>
    <li>Choose <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol>
    <button class="btn" style="width:100%">Got it</button></div>`;
  m.onclick = e => { if (e.target === m || e.target.tagName === "BUTTON") m.remove(); };
  document.body.appendChild(m);
}
async function doInstall(){
  if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; return; }
  if (isIOS) return iosHelp();
  toast("Use your browser menu → Install app / Add to Home screen");
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; showInstallButtons(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; $("#installBtn").classList.add("hidden"); $("#installLogin").classList.add("hidden"); toast("App installed"); });
$("#installBtn").onclick = doInstall;
$("#installLogin").onclick = doInstall;
if (isIOS) showInstallButtons();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
